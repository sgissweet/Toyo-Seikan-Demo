<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Navbar</title>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">

  <style>
    
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="py-2 border-bottom border-primary">
  <div class="container d-flex justify-content-between align-items-center">

    <!-- LOGO -->
    <div class="d-flex align-items-center gap-3">
      <img class="pe-2 border-end" src="../assets/logo/Toyo-1.png" alt="logo">
      <img src="../assets/logo/Toyo-2.png" alt="logo">
    </div>

    <!-- PROFILE -->
    <div class="d-flex align-items-center gap-2 bg-primary-4 text-white rounded px-3 py-1">
      <img src="../assets/images/profile.png" class="rounded-circle">
      <div class="small">
        <div>Position</div>
        <div class="fw-bold border-top border-2 border-primary-1">Username</div>
      </div>
    </div>

  </div>
</div>

<!-- NAVBAR -->
<nav class="py-1 navbar navbar-expand-lg bg-white border-bottom border-5 border-primary">
  <div class="container">

    <!-- MENU -->
    <ul class="navbar-nav me-auto align-items-start gap-4">

      <li class="nav-item">
        <a class="nav-link fs-5" href="#"><img src="../assets/icons/home.svg"/></a>
      </li>

      <li class="nav-item">
        <a class="nav-link fw-semibold text-dark" href="#">หลักสูตร</a>
      </li>

      <li class="nav-item">
        <a class="nav-link fw-semibold text-dark" href="#">ข่าวประชาสัมพันธ์</a>
      </li>

      <li class="nav-item">
        <a class="nav-link fw-semibold text-dark" href="#">คำถามที่พบบ่อย</a>
      </li>

      <li class="nav-item">
        <a class="nav-link fw-semibold text-dark" href="#">วิธีการใช้งาน</a>
      </li>

      <li class="nav-item">
        <a class="nav-link fw-semibold text-dark" href="#">ติดต่อเรา</a>
      </li>

    </ul>

    <!-- SEARCH -->
    <form class="d-flex w-auto border rounded px-1">
      <input class="form-control form-control-sm border-0 shadow-none"
            type="search"
            placeholder="พิมพ์คำค้นหา">

      <button class="btn btn-sm p-0">
        <img src="../assets/icons/search.svg" width="16">
      </button>
    </form>

  </div>
</nav>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
