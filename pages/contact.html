<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/contact.css">
    <link rel="stylesheet" href="../styles/style.css">


</head>

<body data-page="contact">

    <!-- Navbar Component -->
    <div id="navbar"></div>

    <!-- Main Content -->
    <main class="container pt-3">

        <!-- หัวข้อ -->
        <h5 class="mb-3">คำถามที่พบบ่อย</h5>
        <h3 class="text-center fw-bold mb-4">ติดต่อเรา</h3>

        <div class="row g-4 align-items-stretch">

            <!-- อาคาร -->
            <div class="col-lg-6">
                <img src="../assets/images/building.png" class="img-fluid rounded-4 shadow-sm w-100 contact-img" alt="">
            </div>

            <!-- Contact Info -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm h-100 p-4 contact-card">

                    <div class="d-flex mb-4">
                        <div class="icon-circle">
                            <i class="bi bi-geo-alt-fill gradient-icon"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="fw-bold mb-1 gradient-text me-3 mt-1">ที่ตั้ง</h6>
                            <small id="contact-address"></small>
                        </div>
                    </div>

                    <div class="d-flex mb-4">
                        <div class="icon-circle">
                            <i class="bi bi-envelope-fill gradient-icon"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="fw-bold mb-1 gradient-text me-3 mt-1">อีเมล</h6>
                            <small id="contact-email"></small>
                        </div>
                    </div>

                    <div class="d-flex mb-4">
                        <div class="icon-circle">
                            <i class="bi bi-telephone-fill gradient-icon"></i>
                        </div>
                        <div class="ms-3">
                            <h6 class="fw-bold mb-1 gradient-text me-3 mt-1">โทรศัพท์</h6>
                            <small id="contact-tel"></small>
                        </div>
                    </div>

                    <!-- Social -->
                    <div class="d-flex gap-3 justify-content-end ">

                        <div class="social-circle x">
                            <img src="../assets/icons/x.png" alt="X">
                        </div>

                        <div class="social-circle youtube">
                            <img src="../assets/icons/youtube.png" alt="YouTube">
                        </div>

                        <div class="social-circle facebook">
                            <img src="../assets/icons/facebook.png" alt="Facebook">
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- MAP -->
        <div class="card border-0 shadow-sm mt-4 p-3 text-center">

            <div id="contact-map" class="map-wrapper mb-3">

            </div>

            <div class="d-flex justify-content-center">
                <button class="btn btn-primary px-4 py-2 btn-dowload">
                    ดาวน์โหลดแผนที่ <i class="bi bi-download ms-2"></i>
                </button>
            </div>
        </div>

    </main>

    
    <div id="report"></div>

    <!-- Footer Component -->
    <div id="footer"></div>

    <script type="module" src="../scripts/core/layout.js"></script>
    <script src="../scripts/data.js"></script>
    <script src="../scripts/script.js"></script>
    <script src="../scripts/pages/contact.js"></script>



    <!-- Bootstrap JS & Popper -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>


</body>

</html>
