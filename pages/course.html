<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Page</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/course.css">
    <link rel="stylesheet" href="../styles/style.css">




</head>

<body data-page="course">

    <!-- Navbar Component -->
    <div id="navbar"></div>

    <!-- Main Content -->
    <main class="container">
        <!-- NEWS SECTION -->
        <section class="pt-3">

            <div class="row">

                <!-- NEWS -->

                <h5 class=" mb-3">คอร์สเรียนออนไลน์</h5>
                <div class="d-flex align-items-center justify-content-center gap-3 flex-wrap">

                    <label class="mb-0">Search</label>

                    <div class="input-group" style="max-width: 340px;">
                        <input type="text" class="form-control border-primary" placeholder="search">
                        <button class="btn btn-primary">
                            <img src="../assets/icons/search.png" alt="search" width="16">
                        </button>
                    </div>

                    <select class="form-select custom-select-primary" style="max-width: 280px;">
                        <option>Course</option>
                    </select>

                </div>
                <!-- COURSES -->
                <!-- course.html -->

                <section class="py-4">
                    <div class="container">

                        <!-- Tabs -->
                        <ul class="nav nav-tabs mb-4" id="courseTabs">

                            <li class="nav-item">
                                <button class="nav-link active" data-filter="all">
                                    Course
                                </button>
                            </li>

                            <li class="nav-item">
                                <button class="nav-link" data-filter="my">
                                    My Course
                                </button>
                            </li>

                            <li class="nav-item">
                                <button class="nav-link" data-filter="completed">
                                    Completed
                                </button>
                            </li>

                        </ul>

                        <!-- Course List -->
                        <div id="course-list"></div>

                    </div>
                </section>


            </div>
        </section>





        </div>
        </div>
        </section>

    </main>

    <div id ="report"></div>
    <!-- Footer Component -->
    <div id="footer"></div>

    <script type="module" src="../scripts/core/layout.js"></script>
    <script type="module" src="../scripts/pages/course.js"></script>
    <script src="../scripts/data.js"></script>
    <script src="../scripts/script.js"></script>


    <!-- Bootstrap JS & Popper -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>


</body>

</html>
