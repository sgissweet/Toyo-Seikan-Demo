<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Exam Result</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    .result-box{
      border:2px solid #0d6efd;
      background:#fff;
    }

    .score-title{
      color:#0d3b9f;
      font-weight:600;
    }

    .question-dot{
      width:12px;
      height:12px;
      border-radius:50%;
      display:inline-block;
    }

    .dot-red{
      background:#ff1e1e;
    }

    .dot-green{
      background:#4caf50;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div id="navbar"></div>

  <div class="container py-3">

    <div class="row g-3">

      <!-- LEFT -->
      <div class="col-lg-8">

        <!-- Status -->
        <div class="result-box text-center py-3 mb-3 rounded-2">

          <i id="statusIcon" class="fs-2"></i>

          <div id="statusText" class="fw-semibold"></div>

        </div>

        <!-- Summary -->
        <div class="result-box rounded-2 overflow-hidden">

          <table class="table mb-0 align-middle">
            <tbody id="summaryTable" ></tbody>
          </table>

          
        </div>

        <!-- Button -->
        <div class="text-center mt-3">
          <button class="btn btn-primary btn-sm px-4">
            Completed
          </button>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="col-lg-4">

        <div class="d-flex justify-content-between align-items-center mb-2 border-bottom border-secondary">
          <span class="score-title">Score</span>
          <span id="totalScore" class="score-title fs-4"></span>
        </div>

        <table class="table table-sm align-middle">
          <tbody id="questionTable"></tbody>
        </table>

      </div>

    </div>

  </div>
  <!-- Report -->
  <div class="container text-end mb-3">
      <button class="report-btn">
          <i class="bi bi-exclamation-triangle-fill"></i>
          Report problem
      </button>
  </div>
  
  <!-- Footer -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/exam-result.js"></script>
  <script src="../scripts/data.js"></script>
  <script src="../scripts/script.js"></script>
  <!-- nav,foot -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {

      fetch("../components/navbar.html")
          .then(res => res.text())
          .then(html => {
              document.getElementById("navbar").innerHTML = html;

              renderUser();
              renderNav();
          });

      fetch("../components/footer.html")
          .then(res => res.text())
          .then(html => {
              document.getElementById("footer").innerHTML = html;

              renderFooter();  
          });

  });
  </script>
  <script>
    loadLayout();
  </script>
</body>
</html>
