<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/style.css">
</head>

<style>
    .result-card {
        max-width: 1000px;
        margin: 0 auto;
        border: 1px solid #dcdcdc;
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
    }

    .result-header {
        background: #1736b6;
        color: #fff;
        text-align: center;
        padding: 18px;
        font-size: 18px;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }

    .result-card table {
        margin-bottom: 0;
    }

    .result-card th,
    .result-card td {
        padding: 12px 70px !important;
        width: 50%;

        font-size: 18px;
        vertical-align: middle;
        text-align: left;
    }

    .btn-back-result {
        background: #1736b6;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 10px 40px;
        font-size: 18px;
    }
    </style>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- Section -->
    <section class="section">
        <div class="container">
            <h1 class="section-title section-title-sm no-line text-start">ชื่อหลักสูตร</h1>
            <!-- Pre-Test -->
            <div class="result-card mt-4">
                <div class="result-header">
                    <i class="bi bi-pencil-square"></i>
                    Pre-Test result
                </div>

                <table class="table table-bordered mb-0">
                    <tbody>
                        <tr>
                            <th>Course name</th>
                            <td>Test course</td>
                        </tr>
                        <tr>
                            <th>Lesson</th>
                            <td>test1</td>
                        </tr>
                        <tr>
                            <th>Score</th>
                            <td>2 / 3 score</td>
                        </tr>
                        <tr>
                            <th>Score (%)</th>
                            <td>66.67 %</td>
                        </tr>
                        <tr>
                            <th>Test result</th>
                            <td class="text-danger">Fail</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Post-Test -->
            <div class="result-card mt-5">
                <div class="result-header">
                    <i class="bi bi-pencil-square"></i>
                    Post-Test result (1)
                </div>

                <table class="table table-bordered mb-0">
                    <tbody>
                        <tr>
                            <th>Course name</th>
                            <td>Test course</td>
                        </tr>
                        <tr>
                            <th>Lesson</th>
                            <td>test1</td>
                        </tr>
                        <tr>
                            <th>Score</th>
                            <td>3 / 3 score</td>
                        </tr>
                        <tr>
                            <th>Score (%)</th>
                            <td>100 %</td>
                        </tr>
                        <tr>
                            <th>Test result</th>
                            <td class="text-success">Pass</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Back Button -->
            <div class="text-center mt-5">
                <button class="btn-back-result">
                    Back
                </button>
            </div>

        </div>
    </section>

    <!-- Report -->
    <div class="container text-end mb-3">
        <button class="report-btn">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Report problem
        </button>
    </div>
    
    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../scripts/data.js"></script>
    <script src="../scripts/script.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {

        fetch("../components/navbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;

                renderUser();
                renderNav();
            });

        fetch("../components/footer.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("footer").innerHTML = html;

                renderFooter();  
            });

    });
    </script>

</body>
</html>
