<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/style.css">
</head>

<style>
    .btn-back-custom {
    background: var(--primary-dark) !important;
    color: #fff !important;
    border: none !important;

    border-radius: 6px;
    display: inline-flex;
    align-items: center;

    margin-right: 90px;
    gap: 6px;
    font-size: 16px;
    }

    .btn-back-custom:hover {
        background: var(--primary-darkest) !important;
        color: #fff !important;
    }

    .exam-card {
        max-width: 730px;
        margin: 20px auto;
        border: 2px solid var(--primary-dark);
        border-radius: 6px;
        background: #fff;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .exam-title {
        font-size: 19px;
    }

    .exam-course {
        font-size: 19px;
        margin-top: 20px;
    }

    .exam-divider {
        border-bottom: 2px solid #ccc;
        margin-top: 20px;
    }

    .exam-info {
        font-size: 19px;
    }

    .submit-btn-custom {
        background: var(--primary-dark);
        color: #fff;
        border-radius: 6px;
        padding: 10px 50px;
        border: none;
        font-weight: 500;
        margin-top: 40px;
    }

    .submit-btn-custom:hover {
        background: var(--primary-darkest) !important;
        color: #fff !important;
    }

    @media (max-width: 768px) {
        .btn-back-custom {
            margin-right: 0;
            font-size: 14px;
        }

        .exam-title,
        .exam-course,
        .exam-info {
            font-size: 16px;
        }

        .submit-btn-custom {
            width: 100%;
        }
    }
</style>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <!-- Section -->
    <section class="section">

        <div class="container">
            <div class="col-lg-8">
                <a href="../Coursecontent2.html" class="btn btn-back mb-3 btn-back-custom">
                    <i class="bi bi-chevron-left"></i> Back
                </a>
            </div>
        </div>

    <div class="container">

        <!-- CARD -->
        <div class="bg-white p-4 mt-3 mx-auto text-center card-box exam-card">

            <h3 class="mb-0 exam-title">
                Course Examination
            </h3>

            <h4 class="mb-0 exam-course">
                Course Name : How to use “IMCT IT Service Desk Tool”
            </h4>

            <div class="exam-divider"></div>

            <div class="d-flex justify-content-between mt-3 exam-info">
                <span>Number of questions</span>
                <span>10 Questions</span>
            </div>

            <div class="d-flex justify-content-between mt-3 exam-info">
                <span>Time allowed</span>
                <span>20 Minutes</span>
            </div>

            <div class="d-flex justify-content-between mt-3 exam-info">
                <span>Total score</span>
                <span>110 Points</span>
            </div>
        </div>

        <!-- Button -->
        <div class="text-center mt-4">
            <a href="../pages/exam.html">
                <button class="submit-btn submit-btn-custom">
                    TEST
                </button>
            </a>
        </div>

    </div>

        </div>
    </section>

    <!-- Report -->
    <div class="container text-end mb-3">
        <button class="report-btn">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Report problem
        </button>
    </div>
    
    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../scripts/data.js"></script>
    <script src="../scripts/script.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {

        fetch("../components/navbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("navbar").innerHTML = html;

                renderUser();
                renderNav();
            });

        fetch("../components/footer.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("footer").innerHTML = html;

                renderFooter();  
            });

    });
    </script>

</body>
</html>
