<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เอกสารดาวน์โหลด - Toyo Seikan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }
        .main-logo { height: 40px; }
        .group-logo { height: 30px; }

        /* สไตล์ตาราง */
        .custom-table th {
            background-color: #f1f3f5;
            color: #495057;
            font-weight: 600;
        }
        .btn-download {
            background-color: #0d6efd;
            color: white;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-download:hover {
            background-color: #0b5ed7;
            color: white;
        }

        /* ส่วนท้ายเว็บ */
        .footer-bar {
            background-color: #ffffff;
            border-top: 1px solid #dee2e6;
            padding: 15px 0;
        }
        .report-balloon {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #dc3545;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
            border: none;
            transition: transform 0.2s;
        }
        .report-balloon:hover {
            transform: scale(1.05);
        }
    </style>

<!-- NAVBAR -->
    <div id="navbar"></div>

        <main class="container my-4">
            <h5 class="fw-bold mb-3 text-dark"><i class="bi bi-folder-symlink-fill text-primary me-2"></i>เอกสารดาวน์โหลด</h5>
            <p class="mb-4 fw-bold text-secondary border-start border-primary border-4 ps-2">เอกสารล่าสุด</p>

            <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-bordered align-middle text-center custom-table mb-0">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ลำดับ</th>
                                <th class="text-start ps-4">รายการ</th>
                                <th style="width: 140px;">วันที่ประกาศ</th>
                                <th style="width: 150px;">ดาวน์โหลด</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
 <!-- Report -->
    <div id="report"></div>
    
    <!-- Footer -->
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ข้อมูลรายการ
        const rowData = [
            { id: 1, date: '29/07/2565' },
            { id: 2, date: '27/07/2565' },
            { id: 3, date: '18/07/2565' },
            { id: 4, date: '9/07/2565' },
            { id: 5, date: '30/06/2565' },
            { id: 6, date: '26/06/2565' }
        ];
        
        // จัดการนำข้อมูลเข้าตารางโดยใช้ DOM Method ปลอดภัยและเสถียรกว่า document.write
        const tableBody = document.getElementById('tableBody');
        
        rowData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="fw-bold text-secondary">${item.id}</td>
                <td class="text-start ps-4 text-wrap">The standard chunk of Lorem Ipsum used since the 1500s</td>
                <td class="text-muted">${item.date}</td>
                <td>
                    <button class="btn btn-download btn-sm px-3 rounded-2">
                        ดาวน์โหลด <i class="bi bi-file-earmark-arrow-down-fill ms-1"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    </script>

     <script src="../scripts/data.js"></script>
    <script src="../scripts/script.js"></script>

</body>
</html>
