<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyo Seikan (Thailand) - Downloads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-toyo-blue { background-color: #005691; }
        .text-toyo-blue { color: #005691; }
        .bg-table-header { background-color: #2D89CE; }
        .download-btn { background-color: #2D89CE; transition: 0.3s; }
        .download-btn:hover { background-color: #1a6ba3; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- NAVBAR -->
    <div id="navbar"></div>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-xl font-bold text-gray-800 mb-6">เอกสารดาวน์โหลด</h1>
        
        <div class="bg-white rounded-lg shadow-sm border p-6">
            <h2 class="text-lg font-bold mb-6">เอกสารล่าสุด</h2>
            
            <div class="overflow-hidden rounded-t-lg">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-table-header text-white text-sm">
                            <th class="py-3 px-4 border-r border-blue-400 font-normal w-16 text-center">ลำดับ</th>
                            <th class="py-3 px-4 border-r border-blue-400 font-normal">รายการ</th>
                            <th class="py-3 px-4 border-r border-blue-400 font-normal w-40 text-center">วันที่ประกาศ</th>
                            <th class="py-3 px-4 font-normal w-40 text-center">ดาวน์โหลด</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm text-gray-600">
                        <script>
                            const rows = [
                                { id: 1, date: '29/07/2565' },
                                { id: 2, date: '27/07/2565' },
                                { id: 3, date: '18/07/2565' },
                                { id: 4, date: '09/07/2565' },
                                { id: 5, date: '30/06/2565' },
                                { id: 6, date: '26/06/2565' }
                            ];
                            document.write(rows.map(row => `
                                <tr class="border-b hover:bg-gray-50">
                                    <td class="py-3 px-4 text-center border-r">${row.id}</td>
                                    <td class="py-3 px-4 border-r">The standard chunk of Lorem Ipsum used since the 1500s</td>
                                    <td class="py-3 px-4 text-center border-r">${row.date}</td>
                                    <td class="py-2 px-4 text-center">
                                        <button class="download-btn text-white px-4 py-1.5 rounded text-xs flex items-center justify-center mx-auto w-full max-w-[100px]">
                                            ดาวน์โหลด <i class="fas fa-file-download ml-2"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join(''));
                        </script>
                    </tbody>
                </table>
            </div>
        </div>

    <!-- Report -->
    <div id="report"></div>
    
    <!-- Footer -->
    <div id="footer"></div>

        <script src="../scripts/data.js"></script>
    <script src="../scripts/script.js"></script>

</body>
</html>
