<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course - Toyo Seikan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="../styles/style.css">
     
    <style>
        /* ==========================================================================
           สไตล์จากไฟล์ CSS (style.css เดิมของคุณ)
           ========================================================================== */
        /* การตั้งค่าหน้ากระดาษและฟอนต์ */
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8f9fa;
        }

        /* ขนาดโลโก้ต้นฉบับ */
        .main-logo { 
            height: 40px; 
        }

        .group-logo { 
            height: 30px; 
        }

        /* ส่วนแสดงข้อมูลโปรไฟล์มุมขวาบน */
        .profile-text {
            font-size: 12px; 
            line-height: 1.2;
        }

        .profile-text .user-pos {
            opacity: 0.9;
        }

        /* ช่องค้นหาในเมนูบาร์ */
        .search-input {
            border-radius: 20px;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* สไตล์เครื่องเล่นวิดีโอ (สเกล 16:9 อัตโนมัติทุกขนาดหน้าจอ) */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* อัตราส่วน 16:9 */
            background-color: #000;
        }

        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* หน้าต่างเลเยอร์ปุ่ม Play ทับหน้าวิดีโอ */
        .video-play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: opacity 0.3s;
            z-index: 2;
        }

        .play-circle {
            width: 70px;
            height: 70px;
            background: #dc3545; /* ปุ่มเพลย์สีแดงตามสเปกเดิมของคุณ */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* เมนูด้านข้างและบันทึกย่อ */
        .collapse-trigger {
            cursor: pointer;
        }

        .list-item.active {
            background-color: #e9ecef;
        }

        #noteDisplay {
            max-height: 150px; 
            overflow-y: auto;
        }

        /* ส่วนล่างสุดของเว็บ (Footer) */
        .footer-bar {
            background-color: #ffffff;
            border-top: 1px solid #dee2e6;
            position: relative;
        }

        .footer-text {
            font-size: 12px;
        }

        /* ปุ่มรายงานปัญหาลอยด้านซ้ายล่าง */
        .report-balloon-blue {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #0d6efd;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            transition: transform 0.2s;
        }

        .report-balloon-blue:hover {
            transform: scale(1.05);
        }

        /* ตกแต่งการหมุนลูกศรเปิด-ปิดกล่องเล็กน้อย */
        .collapse-trigger[aria-expanded="false"] .bi-chevron-down {
            transform: rotate(-90deg);
        }
        .collapse-trigger .bi-chevron-down {
            transition: transform 0.2s;
        }
    </style>
</head>

         <div id="navbar"></div>

        <main class="container my-4">
            <div class="mb-3">
                <button class="btn btn-outline-secondary btn-sm px-3" onclick="history.back()"><i class="bi bi-chevron-left"></i> Back</button>
            </div>
            
            <h4 class="text-center fw-bold mb-4">
                <span class="border-bottom border-primary border-3 pb-2">Course</span>
            </h4>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                        <div class="bg-light p-3 border-bottom d-flex align-items-center">
                            <i class="bi bi-bullseye text-primary me-2"></i> <strong class="text-dark">Introduction</strong>
                        </div>
                        
                        <div class="video-container">
                            <video id="courseVideo" controls poster="images/dekstudy.png">
                                <source src="videos/lesson1.mp4" type="video/mp4">
                                Browser ของคุณไม่รองรับการเล่นวิดีโอ
                            </video>

                            <div class="video-play-overlay" id="customOverlay" onclick="togglePlay()">
                                <div class="play-circle">
                                    <i class="bi bi-play-fill" id="playIcon"></i>
                                </div>
                            </div>
                        </div>

                        <div class="bg-light p-3 border-top d-flex align-items-center">
                            <i class="bi bi-bullseye text-primary me-2"></i> <strong class="text-secondary">Chapter 1 : Introduction</strong>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2 collapse-trigger" data-bs-toggle="collapse" data-bs-target="#listCollapse">
                            <span><i class="bi bi-list-ul me-2"></i> List</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div class="collapse show" id="listCollapse">
                            <div class="card-body p-0">
                                <div class="p-3 border-bottom list-item active">
                                    <h6 class="fw-bold small mb-1">Chapter 1: Introduction</h6>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="small text-muted">Introduction</span>
                                        <span class="badge bg-primary rounded-pill fw-light" style="font-size: 10px;">Completed</span>
                                    </div>
                                </div>
                                <div class="p-3 list-item">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h6 class="fw-bold small mb-0 text-muted">Chapter 2: Next Lesson</h6>
                                        <span class="badge bg-secondary rounded-pill fw-light" style="font-size: 10px;">In Progress</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2 collapse-trigger" data-bs-toggle="collapse" data-bs-target="#noteCollapse">
                            <span><i class="bi bi-pencil-square me-2"></i> Note</span>
                            <i class="bi bi-chevron-down"></i>
                        </div>
                        <div class="collapse show" id="noteCollapse">
                            <div class="card-body">
                                <textarea class="form-control mb-2" id="userNote" rows="3" placeholder="Type a message and take notes."></textarea>
                                <button class="btn btn-warning w-100 text-white fw-bold py-2 mb-3" onclick="saveNote()">Note</button>
                                
                                <div class="border rounded p-3 bg-white" id="noteDisplay">
                                    <h6 class="text-center border-bottom pb-2 mb-2 text-muted" style="font-size: 14px;">บันทึกของคุณ</h6>
                                    <p class="small text-muted mb-1">1. I Think..</p>
                                    <p class="small text-muted mb-0">2. Very good..</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

   <!-- Report -->
    <div id="report"></div>
    
    <!-- Footer -->
    <div id="footer"></div>

    <script src="../scripts/data.js"></script>
    <script src="../scripts/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const video = document.getElementById('courseVideo');
        const overlay = document.getElementById('customOverlay');

        // ฟังก์ชันเมื่อกดคลิกบนภาพ Overlay เพื่อสั่งเปิดเล่นวิดีโอ
        function togglePlay() {
            if (video.paused) {
                video.play();
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 300);
            }
        }

        // ดักจับจังหวะสลับการหยุด/เล่น เพื่อแสดงผลปุ่มวงกลมสีแดงใหม่อีกครั้ง
        video.addEventListener('pause', () => {
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
        });

        // ฟังก์ชันสร้างบันทึกข้อความเพิ่มแบบ Real-time ลงในกล่องบันทึกของคุณด้านล่าง
        function saveNote() {
            const noteText = document.getElementById('userNote').value;
            if(noteText) {
                const display = document.getElementById('noteDisplay');
                const newNote = document.createElement('p');
                newNote.className = 'small text-muted mb-1';
                newNote.innerText = "- " + noteText;
                display.appendChild(newNote);
                document.getElementById('userNote').value = "";
                display.scrollTop = display.scrollHeight;
            }
        }
    </script>
</body>
</html>
