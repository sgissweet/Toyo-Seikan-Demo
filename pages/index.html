<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet"> -->

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/index.css">


</head>

<body data-page="home">

    <!-- Navbar Component -->
    <div id="navbar-placeholder"></div>


    <!-- Main Content -->
    <main>

        <section class="position-relative">
            <img src="../assets/images/E-learning.png" alt="E-learning" class="w-100 hero-img">
        </section>

        <!-- MENU SHORTCUT -->
        <section class="pt-5">
            <div class="container-fluid">
                <div class="row text-center g-4 justify-content-center shortcut-wrapper">


                    <a  href="../pages/course.html" class="shortcut-card bg-1 ">
                        <span>ห้องเรียนออนไลน์</span>
                    </a>

                    <a  href="../pages/.html" class="shortcut-card bg-2">
                        <span>เอกสารดาวน์โหลด</span>
                    </a>

                    <a  href="../pages/howto.html" class="shortcut-card bg-3">
                        <span>วิธีการใช้งาน</span>
                    </a>

                    <a  href="../pages/howto.html" class="shortcut-card bg-4">
                        <span>สถานการณ์เรียน</span>
                    </a>


                </div>
            </div>
        </section>

        <!-- COURSES -->
        <section class="py-5">
            <div class="container-fluid">

                <h3 class="text-center fw-bold mb-4 section-title">หลักสูตรของเรา</h3>

                <div id="courseCarousel" class="carousel slide">

                    <div class="carousel-inner" id="course-carousel-inner">
                        <!-- JS ใส่ข้อมูลตรงนี้ -->
                    </div>

                    <button class="carousel-control-prev d-none" type="button" id="course-prev"
                        data-bs-target="#courseCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button class="carousel-control-next d-none" type="button" id="course-next"
                        data-bs-target="#courseCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>

                </div>
                <div class="text-center">
                    <a href="../pages/course.html" class="btn btn-primary rounded-pill px-4">
                        ดูทั้งหมด
                    </a>
                </div>

            </div>
        </section>

        <!-- NEWS + VIDEO -->
        <section class="pb-5">
            <div class="container-fluid">
                <div class="row">

                    <!-- NEWS -->
                    <div class="col-md-8">
                        <h5 class="fw-bold mb-3 news-title">ข่าวประชาสัมพันธ์</h5>
                        <div class="row g-3" id="news-cards-container">
                            <!-- JS ใส่ข้อมูลตรงนี้ -->

                        </div>
                        <div class="text-end">
                            <a href="../pages/news.html" class="btn btn-primary rounded-pill px-4">ดูทั้งหมด</a>
                        </div>
                    </div>

                    <!-- VIDEO -->
                    <div class="col-md-4">
                        <h5 class="fw-bold mb-3 news-title">วิดีโอแนะนำ</h5>
                        <div class="video-box d-flex align-items-center justify-content-center mb-4">
                            <iframe src="https://www.youtube.com/embed/ebOeU3NYWSo?start=146"
                                title="YouTube video player"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen>
                            </iframe>
                        </div>
                        <div class="text-end">
                            <a href="#" class="btn btn-primary rounded-pill px-4">ดูทั้งหมด</a>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <!-- Footer Component -->
    <div id="footer"></div>

    <script type="module" src="../scripts/core/layout.js"></script>
    <script type="module" src="../scripts/pages/index.js"></script>
    <script type="module" src="../scripts/pages/news.js"></script>

    <!-- Bootstrap JS & Popper -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>


</body>

</html>
