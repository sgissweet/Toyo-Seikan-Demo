<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Exam</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    .nav-link {
      color: black !important;
    }

    .nav-link.active {
      color: white !important;
      background-color: #1F7BCC !important;
    }

  </style>
</head>

<body>

  <!-- Header -->
  <div class="d-flex justify-content-end mb-3">
    <nav>
      <ol class="breadcrumb mb-0 fs-5">
        <li class="breadcrumb-item"><a href="#">หน้าแรก</a></li>
        <li class="breadcrumb-item"><a href="#">หลักสูตร</a></li>
        <li class="breadcrumb-item active">บทที่ 1</li>
      </ol>
    </nav>
  </div>

  <div class="d-flex justify-content-center">
    <div class="border border-1 px-5 py-3">
      <span class="pe-2 fs-5">Time:</span>
      <span class="text-danger fs-5">00:20:00</span>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center border-bottom pb-1">
    <span class="fs-5">Question</span>
    <span id="exam-count">0/10</span>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-pills my-3 text-center" id="exam-tabs">
    
  </ul>

  <!-- Contents -->
  <div class="tab-content" id="exam-content">
  </div>

  <div class="d-flex justify-content-center gap-2 mt-4">
    <button class="btn btn-outline-primary" id="previous-bt" type="button">Previous</button>
    <button class="btn btn-success px-4" id="submit-bt" type="button">Send</button>
  </div>

  
  <!-- Modal -->
  <div class="modal fade" id="completeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;"">
      <div class="modal-content py-3">
        <div class="modal-body d-flex flex-column align-items-center text-center gap-3">
          <img src="../assets/icons/check-mark.svg"/>
          <h5 class="modal-title">Complete</h5>
          <button type="button" class="btn btn-primary px-4"
                  onclick="window.location.href='exam-result.html'">
            OK
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="warningModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title text-danger">Incomplete Exam</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body" id="warning-message">
          Please complete all questions.
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary"
                  data-bs-dismiss="modal">
            Close
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/layout.js"></script>
  <script src="../scripts/exam.js" ></script>
  <script>
    loadLayout();
  </script>
</body>
</html>
