<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>วิธีการใช้งาน - Toyo Seikan</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../styles/style.css">

    <style>

      .page-header {
        position: relative;
        margin-bottom: 60px;
      }

      .small-title {
        position: absolute;
        left: 0;
        top: 0;

        font-size: 14px;
        color: #444;
        
      }

      .main-title {
        text-align: center;
        
        font-size: 32px;
        font-weight: 700;
        color: #111;
      }

      .row.justify-content-center {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
      }

      .tutorial-card {
  text-align: center;
  width: 180px;

  transition: 0.3s;
  cursor: pointer;
}

.tutorial-card:hover {
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 12px 24px rgba(0,0,0,0.12);
}

      .tutorial-card img {
        width: 180px;
        height: 140px;
        object-fit: cover;
        border-radius: 10px;
        display: block;
        margin: 0 auto 12px;
      }

      .tutorial-card div {
        font-size: 16px;
      }

      @media (max-width: 768px) {
        .tutorial-card {
          width: 150px;
        }

        .tutorial-card img {
          width: 150px;
          height: 120px;
        }

        .main-title {
          font-size: 32px;
        }
      }

    </style>
</head>

<body>

<!-- ===== Navbar ===== -->
<div id="navbar"></div>

<!-- ===== Content ===== -->
<main class="container my-5">

<div class="page-header">

  <!-- มุมซ้าย -->
  <div class="small-title">
    วิธีการใช้งาน
  </div>

  <!-- ตรงกลาง -->
  <h3 class="main-title">
    วิธีการใช้งาน
  </h3>

</div>

<div class="row justify-content-center">

    <!-- Card 1 -->
    <div class="col-auto">
      <div class="tutorial-card">
        <img src="../assets/images/ht1.png">
        <div>วิธีการสมัครสมาชิก</div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="col-auto">
      <div class="tutorial-card">
        <img src="../assets/images/ht2.png">
        <div>ลืมรหัสผ่าน</div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="col-auto">
      <div class="tutorial-card">
        <img src="../assets/images/ht3.png">
        <div>การเข้าสู่ห้องเรียนออนไลน์</div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="col-auto">
      <div class="tutorial-card">
        <img src="../assets/images/ht4.png">
        <div>การสอบและผลการสอบ</div>
      </div>
    </div>

    <!-- Card 5 -->
    <div class="col-auto">
      <div class="tutorial-card">
        <img src="../assets/images/ht5.png">
        <div>การพิมพ์ใบประกาศ</div>
      </div>
    </div>

</div>

</main>

<!-- Report -->
<div id="report"></div>

<!-- ===== Footer ===== -->
<div id="footer"></div>

<!-- nav,foot -->
<script type="module" src="../scripts/core/layout.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="../scripts/data.js"></script>
<script src="../scripts/script.js"></script>

</body>
</html>
