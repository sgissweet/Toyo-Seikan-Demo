<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>วิธีการใช้งาน - Toyo Seikan</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- CSS  -->
    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>

<!-- ===== Header ===== -->
<div class="bg-light py-2">
  <div class="container d-flex justify-content-between align-items-center">

    <div class="d-flex align-items-center">
      <img src="../images/logo/logo1.jpg" height="30">
      <div class="mx-3" style="width:1px; height:30px; background:#ccc;"></div>
      <img src="../images/logo/logo2.jpg" height="30">
    </div>

    <div class="user-box text-white px-2 py-1 rounded-3 d-flex align-items-center" style="background:#07467C;">
      <img src="../images/user/user.jpg" class="rounded-circle me-2" width="28" height="28" style="object-fit:cover;">
      <div style="line-height:1;">
        <small style="font-size:11px; opacity:0.8;">Student</small>
        <div style="height:1px; background:rgba(255,255,255,0.5); margin:2px 0;"></div>
        <span style="font-size:14px; font-weight:600;">Sim</span>
      </div>
    </div>

  </div>
</div>

<!-- ===== Navbar ===== -->
<div id="navbar"></div>

      <!-- Search Box -->
      <div class="search-box-nav">
        <i class="bi bi-search"></i>
        <input type="search" class="form-control rounded-pill" placeholder="พิมพ์คำค้นหา">
      </div>
    </div>
  </div>
</nav>

<!-- ===== Content ===== -->
<main class="container my-5">

  

<div class="page-header mb-5">

  <!-- มุมซ้าย -->
  <div class="small-title">
    วิธีการใช้งาน
  </div>

  <!-- ตรงกลาง -->
  <h3 class="main-title">
    วิธีการใช้งาน
  </h3>

</div>

  <div class="row justify-content-center g-4">

    <!-- Card 1 -->
    <div class="col-md-2 col-6">
      <div class="tutorial-card text-center">
        <img src="../images/howtouse/1.png" class="img-fluid rounded mb-2">
        <div>วิธีการสมัครสมาชิก</div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="col-md-2 col-6">
      <div class="tutorial-card text-center">
          <div class="img-wrapper">
        <img src="../images/howtouse/2.png">
          </div>
        <div>ลืมรหัสผ่าน</div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="col-md-2 col-6">
      <div class="tutorial-card text-center">
        <img src="../images/howtouse/3.png" class="img-fluid rounded mb-2">
        <div>การเข้าสู่ห้องเรียนออนไลน์</div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="col-md-2 col-6">
      <div class="tutorial-card text-center">
        <img src="../images/howtouse/4.png" class="img-fluid rounded mb-2">
        <div>การสอบและผลการสอบ</div>
      </div>
    </div>

    <!-- Card 5 -->
    <div class="col-md-2 col-6">
      <div class="tutorial-card text-center">
        <img src="../images/howtouse/5.png" class="img-fluid rounded mb-2">
        <div>การพิมพ์ใบประกาศ</div>
      </div>
    </div>

  </div>

</main>

<!-- Report -->
<div id="report"></div>
<!-- ===== Footer ===== -->
<div id="footer"></div>
<!-- nav,foot -->
<script type ="module" src="../scripts/core/layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
