<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิดีโอแนะนำ - Toyo Seikan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div class="content-wrapper flex-grow-1">
        <header class="container-fluid top-header bg-white border-bottom py-2">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="logo-wrapper d-flex align-items-center flex-wrap gap-2">
            <img src="images/toyo.jpg" alt="Toyo Seikan Logo" class="main-logo">
            <img src="images/toyogroup.jpg" alt="Group Logo" class="group-logo border-start ms-2 ps-2 ms-sm-3 ps-sm-3" onerror="this.style.display='none'">
        </div>
        
        <div class="user-profile d-flex align-items-center bg-primary text-white px-3 py-2 rounded shadow-sm ms-auto ms-md-0">
            <i class="bi bi-person-circle fs-5 me-2"></i>
            <div class="text-start profile-text">
                <div class="user-pos fw-light">Position</div>
                <div class="user-name fw-bold">Username</div>
            </div>
        </div>
    </div>
</header>

        <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand d-lg-none text-muted" href="#">เมนูใช้งาน</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-house-fill d-none d-lg-inline"></i><span class="d-lg-none">หน้าแรก</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="#">หลักสูตร</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">ข่าวประชาสัมพันธ์</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">คำถามที่พบบ่อย</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">วิธีการใช้งาน</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">ติดต่อเรา</a></li>
                    </ul>
                    <div class="d-flex align-items-center position-relative mt-2 mt-lg-0">
                        <input type="text" class="form-control form-control-sm search-nav-input" placeholder="พิมพ์คำค้นหา">
                        <i class="bi bi-search search-nav-icon"></i>
                    </div>
                </div>
            </div>
        </nav>

        <main class="container my-5">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item active text-muted" aria-current="page">วิดีโอแนะนำ</li>
                </ol>
            </nav>

            <h3 class="text-center fw-bold mb-5 main-title">
                <span class="border-bottom border-primary border-3 pb-2">วิดีโอแนะนำ</span>
            </h3>

            <div class="row justify-content-center mb-5">
                <div class="col-md-8 col-lg-6">
                    <div class="d-flex align-items-center justify-content-center gap-3">
                        <span class="fw-bold text-secondary">Search</span>
                        <div class="input-group shadow-sm search-center-box">
                            <input type="text" class="form-control" placeholder="ค้นหาวิดีโอที่ต้องการ...">
                            <button class="btn btn-primary px-4" type="button">
                                <i class="bi bi-search text-white"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4" id="videoGrid">
                </div>

            <div class="d-flex justify-content-center mt-5">
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm shadow-sm rounded">
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">หน้าถัดไป &gt;</a></li>
                        <li class="page-item"><a class="page-link" href="#">หน้าสุดท้าย &gt;&gt;</a></li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>

    <footer class="footer-bar py-3 border-top bg-white">
        <button class="report-balloon border-0 shadow">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Report problem
        </button>
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2 text-muted footer-text">
            <span>สงวนลิขสิทธิ์ &copy; 2021 Toyo Seikan (Thailand) Co., Ltd.</span>
            <span class="fw-bold">Toyo Seikan Group</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // กำหนดรูปภาพหน้าปกและจำนวนลูปที่ต้องการแสดง
        const thumbImg = "images/giftbox.jpg"; 
        const videoGrid = document.getElementById('videoGrid');
        
        // วนลูปสร้างการ์ดวิดีโอ 6 ชิ้นแบบมาตรฐาน DOM (ปลอดภัยกว่า document.write)
        for(let i = 1; i <= 6; i++) {
            const col = document.createElement('div');
            col.className = 'col-sm-6 col-md-4';
            col.innerHTML = `
                <div class="card video-card border-0 shadow-sm rounded-3 overflow-hidden h-100">
                    <div class="video-thumb position-relative overflow-hidden" style="cursor: pointer;">
                        <img src="${thumbImg}" class="w-100" style="aspect-ratio: 16/9; object-fit: cover;" alt="Video Thumbnail" onerror="this.src='https://via.placeholder.com/400x225?text=Video+Thumbnail'">
                        <div class="play-overlay position-absolute top-50 start-50 translate-middle">
                            <i class="bi bi-play-circle-fill text-white display-4 shadow-sm"></i>
                        </div>
                    </div>
                    <div class="p-3 border-top bg-white">
                        <p class="mb-0 text-dark small fw-bold text-truncate">Video Name Title - ${i}</p>
                    </div>
                </div>
            `;
            videoGrid.appendChild(col);
        }
    </script>
</body>
</html>
